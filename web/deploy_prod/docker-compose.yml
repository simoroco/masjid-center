services:
  masjid-center:
    platform: linux/arm64
    image: simoroco/masjid-center:latest
    container_name: masjid-center
    # Network mode: bridge is the default on every OS — the iOS app locates
    # the server by scanning the subnet on :7777 (Core/ServerDiscovery.swift),
    # so host networking is not required. NETWORK_MODE=host remains available
    # on Linux if you want the real host IP auto-detected in the container.
    network_mode: ${NETWORK_MODE:-bridge}
    ports:
      - "7777:7777"
      - "7778:7778"  # HTTPS port
    volumes:
      # PRODUCTION VOLUMES - Auto-created by Docker if they don't exist
      # The container automatically initializes empty folders with default files
      - ./data:/app/data        # SQLite database (auto-initialized on first run)
      - ./audio:/app/audio      # Audio files (auto-initialized from image)
      - /dev/snd:/dev/snd       # Audio device passthrough for speakers
    devices:
      - /dev/snd:/dev/snd
    privileged: true
    environment:
      - TZ=Europe/Paris         # Timezone (modify as needed)
      - NODE_ENV=production
      # start.sh always detects and passes the real LAN hostname/IP so the
      # container can display the correct server address in bridge mode.
      - HOST_HOSTNAME=${HOST_HOSTNAME:-}
      - HOST_IP=${HOST_IP:-}
    restart: unless-stopped
