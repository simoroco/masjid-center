name: MasjidCenter
options:
  bundleIdPrefix: com.masjidcenter
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "8.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  MasjidCenter:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: MasjidCenter
    info:
      path: MasjidCenter/Info.plist
      properties:
        CFBundleDisplayName: Masjid Center
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UILaunchScreen_Generation: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocationWhenInUseUsageDescription: Your location is used once to download prayer times for your city.
        NSLocalNetworkUsageDescription: Used to find your Masjid Center server on your local network and to play its audio files.
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masjidcenter.app
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: "HZ947F72NK"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  MasjidCenterUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: MasjidCenterUITests
    dependencies:
      - target: MasjidCenter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masjidcenter.app.uitests
        TEST_TARGET_NAME: MasjidCenter
        GENERATE_INFOPLIST_FILE: YES
